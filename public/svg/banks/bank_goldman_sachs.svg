<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <linearGradient id="gsGrad" x1="0" y1="0" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="gsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect x="10" y="10" width="220" height="220" rx="16" fill="url(#gsGrad)" stroke="rgba(147, 197, 253, 0.3)" stroke-width="2"/>
  <rect x="24" y="24" width="192" height="192" rx="10" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- GS Monogram -->
  <text x="120" y="115" font-family="'SF Pro Display', system-ui, sans-serif" font-size="52" font-weight="900" fill="#93C5FD" text-anchor="middle" letter-spacing="-0.02em" filter="url(#gsGlow)">GS</text>
  <text x="120" y="150" font-family="'SF Pro Display', system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.16em">GOLDMAN SACHS</text>
  <text x="120" y="174" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#60A5FA" text-anchor="middle" letter-spacing="0.1em">PRIME BROKERAGE</text>
</svg>