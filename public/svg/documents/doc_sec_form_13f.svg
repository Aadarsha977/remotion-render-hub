<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 640" fill="none">
  <defs>
    <linearGradient id="docPaper" x1="0" y1="0" x2="480" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E2330" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#141722" stop-opacity="0.98"/>
    </linearGradient>
  </defs>
  <!-- Manila Paper Base -->
  <rect x="10" y="10" width="460" height="620" rx="8" fill="url(#docPaper)" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <!-- Header Banner -->
  <rect x="25" y="25" width="430" height="50" rx="4" fill="rgba(255,255,255,0.05)"/>
  <text x="40" y="48" font-family="'SF Pro Display', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" letter-spacing="0.05em">UNITED STATES SECURITIES &amp; EXCHANGE COMMISSION</text>
  <text x="40" y="65" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#38BDF8">FORM 13F // INFORMATION TABLE</text>
  
  <!-- Redacted Lines -->
  <rect x="40" y="100" width="220" height="12" rx="2" fill="#38BDF8" fill-opacity="0.2"/>
  <rect x="40" y="125" width="400" height="8" rx="2" fill="rgba(255,255,255,0.1)"/>
  <rect x="40" y="145" width="370" height="8" rx="2" fill="rgba(255,255,255,0.1)"/>
  
  <!-- Redacted Table Rows -->
  <rect x="40" y="180" width="400" height="18" fill="rgba(255,255,255,0.06)"/>
  <text x="50" y="193" font-family="ui-monospace, monospace" font-size="9" fill="rgba(255,255,255,0.5)">NAME OF ISSUER           CUSIP     VALUE (x$1000)  SHARES</text>
  
  <rect x="40" y="210" width="180" height="14" fill="#000000"/>
  <rect x="40" y="235" width="220" height="14" fill="#000000"/>
  <rect x="40" y="260" width="160" height="14" fill="#000000"/>
  <rect x="40" y="285" width="200" height="14" fill="#000000"/>
  
  <!-- Void Stamp Diagonal -->
  <g transform="translate(140, 360) rotate(-16)">
    <rect x="-10" y="-10" width="240" height="60" rx="4" fill="#EF4444" fill-opacity="0.15" stroke="#EF4444" stroke-width="3" stroke-dasharray="6,3"/>
    <text x="110" y="30" font-family="'SF Pro Display', sans-serif" font-size="22" font-weight="900" fill="#EF4444" text-anchor="middle" letter-spacing="0.1em">NOT REQUIRED</text>
    <text x="110" y="46" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#FCA5A5" text-anchor="middle">SWAP LOOPHOLE ACTIVE</text>
  </g>
</svg>