<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <!-- Fulcrum Base -->
  <polygon points="200,80 180,220 220,220" fill="rgba(255,255,255,0.15)"/>
  <circle cx="200" cy="80" r="10" fill="#38BDF8"/>
  <!-- Tilted Beam -->
  <line x1="60" y1="120" x2="340" y2="40" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>
  <!-- Left Pan: Collateral ($10B) -->
  <line x1="60" y1="120" x2="60" y2="170" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  <rect x="20" y="170" width="80" height="34" rx="6" fill="rgba(56, 189, 248, 0.2)" stroke="#38BDF8" stroke-width="2"/>
  <text x="60" y="192" font-family="'SF Pro Display', sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">$10B COLLATERAL</text>
  <!-- Right Pan: Extreme Leverage ($100B) -->
  <line x1="340" y1="40" x2="340" y2="190" stroke="#EF4444" stroke-width="2"/>
  <rect x="290" y="190" width="100" height="42" rx="6" fill="rgba(239, 68, 68, 0.25)" stroke="#EF4444" stroke-width="3"/>
  <text x="340" y="212" font-family="'SF Pro Display', sans-serif" font-size="12" font-weight="900" fill="#EF4444" text-anchor="middle">$100B EXPOSURE</text>
  <text x="340" y="226" font-family="ui-monospace, monospace" font-size="8" fill="#FCA5A5" text-anchor="middle">10x LEVERAGE</text>
</svg>