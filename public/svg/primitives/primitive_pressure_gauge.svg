<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" fill="none">
  <defs>
    <linearGradient id="gaugeArc" x1="0" y1="0" x2="280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="85%" stop-color="#EF4444"/>
    </linearGradient>
  </defs>
  <!-- Background Arc -->
  <path d="M 40 160 A 100 100 0 0 1 240 160" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="18" stroke-linecap="round"/>
  <!-- Gradient Arc -->
  <path d="M 40 160 A 100 100 0 0 1 230 130" fill="none" stroke="url(#gaugeArc)" stroke-width="18" stroke-linecap="round"/>
  <!-- Pivot and Needle -->
  <circle cx="140" cy="160" r="12" fill="#FFFFFF"/>
  <line x1="140" y1="160" x2="215" y2="75" stroke="#EF4444" stroke-width="5" stroke-linecap="round"/>
  <circle cx="140" cy="160" r="6" fill="#EF4444"/>
  <!-- Readout -->
  <text x="140" y="130" font-family="'SF Pro Display', sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle">94%</text>
  <text x="140" y="190" font-family="ui-monospace, monospace" font-size="11" font-weight="bold" fill="#EF4444" text-anchor="middle">LEVERAGE CAPACITY: OVERLOAD</text>
</svg>